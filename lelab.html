<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Lab — Studio Larzac</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#020805;--panel:#03110a;--fg:#19ff66;--dim:#1fa04a;--mut:#3fae66;--line:#0e5a2a;--blue:#2aa8ff;--bad:#ff7b6e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020805}}
:root[data-theme="dark"]{--bg:#020805}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Share Tech Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.3em;text-shadow:0 0 12px var(--fg)}
h1 i{display:inline-block;width:12px;height:22px;background:var(--fg);margin-left:10px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hr{color:var(--dim);font-size:12px;letter-spacing:.15em;text-align:right}
.lay{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);padding:16px 0}
aside h2{margin:18px 0 6px;padding:0 18px 6px;font-size:13px;font-weight:400;letter-spacing:.22em;color:var(--dim);border-bottom:1px solid var(--line);text-transform:uppercase}
aside h2:first-child{margin-top:0}
aside button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;letter-spacing:.08em;color:var(--mut);background:none;border:0;padding:5px 18px;cursor:pointer}
aside button:hover{color:var(--fg)}
aside button[aria-pressed="true"]{color:var(--fg);text-shadow:0 0 8px var(--fg)}
main{padding:18px 20px 60px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{font:inherit;letter-spacing:.2em;font-size:14px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;text-transform:uppercase}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);background:#06240f;border-bottom-color:var(--fg);text-shadow:0 0 8px var(--fg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.box{border:1px solid var(--fg);background:var(--panel);padding:14px 16px}
.box h3{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:14px;font-weight:400;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.it{padding:8px 0;border-bottom:1px solid #0a2a15}
.it:last-child{border:0}
.it b{font-weight:400;letter-spacing:.04em}
.it b::before{content:"> ";color:var(--dim)}
.d{display:block;color:var(--mut);font-size:13px;margin:2px 0 0 14px}
.bg{font-size:12px;letter-spacing:.06em;margin-left:6px}
.E{color:var(--fg);background:#08381a;padding:0 4px;font-weight:700}
.R{color:var(--blue)}
.O{color:var(--dim)}
.tips{border:1px dashed var(--line);padding:12px 16px;margin-top:10px}
.tips p{margin:0 0 6px;color:var(--dim);letter-spacing:.15em;font-size:13px}
.tips div{padding:3px 0}
.tips div::before{content:"> ";color:var(--dim)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
input[type=checkbox]{accent-color:var(--fg);width:18px;height:18px;flex:none}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pc div{font-size:13px;color:var(--mut)}
.pc .c{color:var(--bad)}
.n{color:var(--dim);font-size:12px;margin-top:6px}
header{flex-wrap:wrap}
#q{flex:1;max-width:340px;min-width:140px;font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);padding:7px 10px}
#q:focus{outline:2px solid var(--fg)}#q::placeholder{color:var(--dim)}
.fm{display:grid;gap:12px}
.fm label{display:flex;flex-direction:column;font-size:12px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.fm input,.fm textarea,.fm select{font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:6px 8px;letter-spacing:0;text-transform:none}
.fm input:focus,.fm textarea:focus,.fm select:focus{outline:2px solid var(--fg)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:0 0 14px}
.meta label{display:flex;flex-direction:column;font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.meta input{font:inherit;font-size:15px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:4px 0;outline:0;text-transform:none;letter-spacing:0}
.meta input:focus{border-bottom-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row button{font:inherit;color:var(--fg);background:none;border:1px solid var(--fg);padding:8px 14px;cursor:pointer;letter-spacing:.1em}
.row button:hover{background:#08381a}
details.tp{margin:4px 0 0 14px}
details.tp summary{cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:.1em}
.tl{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mut)}
.tl li::before{content:"+ ";color:var(--dim)}
@media print{body{background:#fff;color:#000;font-size:12pt}header,aside,.tabs,.noprint{display:none!important}.lay{display:block}main{padding:0}.box{border:1px solid #000;background:#fff;color:#000;break-inside:avoid}.box h3{color:#000;border-color:#000}.meta label{color:#000}.meta input{color:#000;border-bottom:1px solid #000}.ck{color:#000;border-color:#999}input[type=checkbox]{accent-color:#000}}
@media (max-width:760px){.meta{grid-template-columns:1fr}.lay{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:42vh;overflow:auto}.hr{display:none}.pc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){h1 i{animation:none}}
</style>
</head>

const ADD2={
course:[["drone","R","Plan aérien de la poursuite"]],
foule:[["drone","R","Plan aérien d’établissement"]],

Object.entries(ADD2).forEach(([k,v])=>{const s=ALLSC.find(x=>x[0]===k);if(s)s[2].push(...v)});
Object.entries(ADD).forEach(([k,v])=>{const s=ALLSC.find(x=>x[0]===k);if(s)s[2].push(...v)});
ALLSC.forEach(s=>{const i=s[2].findIndex(x=>x[0]==="gh4");if(i>-1)s[2].splice(i+1,0,["gh5",s[2][i][1],s[0]==="nuit"?"Un peu meilleur que le GH4 à ISO élevé":"Même rôle, avec stabilisation capteur et 4K 60p"])});
const BASE_G=JSON.parse(JSON.stringify(G)),BASE_T=JSON.parse(JSON.stringify(TIPS)),BASE_S=ALLSC.map(s=>JSON.parse(JSON.stringify(s[2])));
const saveCU=()=>{try{localStorage.setItem("lab-custom",JSON.stringify(CU))}catch(e){}};
function applyCustom(){
 Object.keys(G).forEach(k=>delete G[k]);Object.assign(G,JSON.parse(JSON.stringify(BASE_G)));
 Object.keys(TIPS).forEach(k=>delete TIPS[k]);Object.assign(TIPS,JSON.parse(JSON.stringify(BASE_T)));
 ALLSC.forEach((s,i)=>{s[2]=JSON.parse(JSON.stringify(BASE_S[i]))});
 CU.del.forEach(id=>{delete G[id];delete TIPS[id];ALLSC.forEach(s=>{s[2]=s[2].filter(x=>x[0]!==id)})});
 Object.keys(CU.gear).forEach(id=>{if(CU.del.includes(id))return;G[id]=CU.gear[id];TIPS[id]=CU.tips[id]||[]});
 Object.keys(CU.use).forEach(id=>{if(!G[id])return;ALLSC.forEach(s=>{s[2]=s[2].filter(x=>x[0]!==id)});
  Object.entries(CU.use[id]).forEach(([sid,v])=>{const s=ALLSC.find(x=>x[0]===sid);if(s)s[2].push([id,v[0],v[1]])})})}
applyCustom();
const isMod=id=>!!BASE_G[id]&&!!(CU.gear[id]||CU.use[id]||CU.tips[id]);
function saveForm(){const v=i=>document.getElementById(i).value.trim(),L=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
 const name=v("f-name");if(!name){document.getElementById("f-name").focus();return}
 const id=ED.id||"c"+Date.now().toString(36);
 CU.gear[id]=[v("f-cat"),name,v("f-desc"),L(document.getElementById("f-pros").value),L(document.getElementById("f-cons").value)];
 CU.tips[id]=L(document.getElementById("f-tips").value);
 const u={};document.querySelectorAll("[data-sc]").forEach(sel=>{if(sel.value){const old=ED.lv[sel.dataset.sc];u[sel.dataset.sc]=[sel.value,old?old[2]:""]}});
 CU.use[id]=u;CU.del=CU.del.filter(x=>x!==id);saveCU();ED=null;applyCustom();render()}
function vForm(){const id=ED.id,g=id?G[id]:["cam","","",[],[]],t=id?(TIPS[id]||[]):[],lv=ED.lv,L=a=>esc(a.join("\n"));
 return `<div class="box"><h3>// ${id?"Modifier":"Ajouter"} une pièce</h3><div class="fm">
<label>Nom<input id="f-name" value="${esc(g[1])}"></label>
<label>Catégorie<select id="f-cat">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===g[0]?"selected":""}>${c[1]}</option>`).join("")}</select></label>
<label>Description<input id="f-desc" value="${esc(g[2])}"></label>
<label>Avantages (un par ligne)<textarea id="f-pros" rows="3">${L(g[3])}</textarea></label>
<label>Contraintes (une par ligne)<textarea id="f-cons" rows="3">${L(g[4])}</textarea></label>
<label>Conseils d’utilisation (un par ligne)<textarea id="f-tips" rows="3">${L(t)}</textarea></label>
<p class="n">Utile pour quelles scènes ?</p>
<div class="sg">${ALLSC.map(s=>`<label>${s[1]}<select data-sc="${s[0]}"><option value="">—</option>${["E","R","O"].map(l=>`<option value="${l}" ${lv[s[0]]&&lv[s[0]][1]===l?"selected":""}>${LB[l]}</option>`).join("")}</select></label>`).join("")}</div>
<div class="row"><button data-save="1">Enregistrer</button><button data-cancel="1">Annuler</button></div></div></div>`}
function vInv(){if(ED)return vForm();
 return `<div class="row noprint" style="margin:0 0 14px"><button data-add="1">+ Ajouter une pièce</button><button data-resetall="1">${RA?"Confirmer la réinitialisation":"Tout réinitialiser"}</button></div>`+vInvList()}
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function vSearch(q){const n=nrm(q.trim());
 const gl=Object.keys(G).filter(k=>nrm([G[k][1],G[k][2],G[k][3].join(" "),G[k][4].join(" "),(TIPS[k]||[]).join(" "),CATS.find(c=>c[0]===G[k][0])[1]].join(" ")).includes(n));
 const sl=ALLSC.filter(s=>nrm(s[1]+" "+s[3].join(" ")).includes(n));
 const sb=(s,t)=>`<button data-h="${s[0]}-${t}">${s[1]}</button>`;
 const gh=gl.map(k=>{const us=ALLSC.filter(s=>s[2].some(x=>x[0]===k));
  return `<div class="it"><b>${G[k][1]}</b><span class="d">${G[k][2]}</span><div class="row">${us.map(s=>sb(s,"materiel")).join("")||'<span class="d">Aucune scène pour l’instant</span>'}<button data-h="${ALLSC[0][0]}-inventaire">Voir la fiche</button></div></div>`}).join("");
 return `<div class="box"><h3>// Recherche — ${esc(q.trim())}</h3>${gl.length||sl.length?"":'<p class="n">Aucun résultat.</p>'}${gl.length?`<h3>Matériel</h3>${gh}`:""}${sl.length?`<h3>Scènes</h3><div class="row">${sl.map(s=>sb(s,"materiel")).join("")}</div>`:""}</div>`}
const BASE=["Batteries chargées (GH4, GH5, Osmo, drone, panneaux LED, moniteur)","Cartes SD vidées","Optiques propres","Balance des blancs réglée","Niveaux audio testés"];
const TABS=[["materiel","Matériel"],["conseils","Conseils"],["checklist","Check-list"],["inventaire","Inventaire"]];
const $=id=>document.getElementById(id);let tk=0,ck={};
try{ck=JSON.parse(localStorage.getItem("lab-ck")||"{}")}catch(e){}
function typeIn(root){const my=++tk,els=[...root.querySelectorAll("[data-t]")],rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
 els.forEach(e=>e.textContent=rm?e.dataset.t:"");if(rm)return;let i=0;
 (function nxt(){if(my!==tk||i>=els.length)return;const e=els[i++],t=e.dataset.t;let k=0;
 const iv=setInterval(()=>{if(my!==tk){clearInterval(iv);return}k+=2;e.textContent=t.slice(0,k);if(k>=t.length){clearInterval(iv);nxt()}},8)})()}
const item=(id,l,note)=>`<div class="it"><b>${G[id][1]}</b><span class="bg ${l}">[${LB[l]}]</span>${note?`<span class="d">${note}</span>`:""}<details class="tp"><summary>Conseils</summary>${tipsList(id)}</details></div>`;
function vMateriel(s){return `<div class="grid">`+CATS.map(c=>{const r=s[2].filter(x=>G[x[0]][0]===c[0]);return r.length?`<div class="box"><h3>// ${c[1]}</h3>${r.map(x=>item(x[0],x[1],x[2])).join("")}</div>`:""}).join("")+`</div>`+tipsBox(s)}
function tipsBox(s){return `<div class="box"><h3>// Astuces — ${s[1]}</h3><div class="tips"><p>CONSEILS :</p>${s[3].map(t=>`<div data-t="${t}"></div>`).join("")}</div></div>`}
function vConseils(s){return `<div class="box"><h3>// Conseils — ${s[1]}</h3><div class="tips"><p>RÉGLAGES ET CONSEILS :</p>${s[3].map(t=>`<div data-t="${t}"></div>`).join("")}</div></div>`}
function vCheck(s){const items=[...s[2].filter(x=>x[1]==="E").map(x=>G[x[0]][1]),...BASE];
 return `<div class="box"><h3>// Check-list — ${s[1]}</h3><div class="meta">${[["film","Titre du film"],["seq","N° de séquence"],["sc","N° de scène"]].map(f=>`<label>${f[1]}<input data-m="${f[0]}" value="${esc(META[f[0]]||"")}"></label>`).join("")}</div>${items.map((t,i)=>{const k=s[0]+i;return `<label class="ck"><input type="checkbox" data-k="${k}" ${ck[k]?"checked":""}><span>${t}</span></label>`}).join("")}<p class="n noprint">Cochez au fur et à mesure, c’est mémorisé dans ce navigateur.</p><div class="noprint row"><button id="pr">Imprimer / PDF</button><button data-rs="${s[0]}">Tout décocher</button></div></div>`}
function used(id){return ALLSC.filter(s=>s[2].some(x=>x[0]===id)).length}
function vInvList(){return `<div class="grid">`+CATS.map(c=>`<div class="box"><h3>// ${c[1]}</h3>`+Object.keys(G).filter(k=>G[k][0]===c[0]).map(k=>{const g=G[k];return `<div class="it"><b>${g[1]}</b><span class="d">${g[2]}</span><div class="pc"><div>+ ${g[3].join("<br>+ ")}</div><div class="c">- ${g[4].join("<br>- ")}</div></div><div class="n">Conseils d’utilisation</div>${tipsList(k)}<div class="n">Utile dans ${used(k)} scène(s)</div><div class="row noprint"><button data-edit="${k}">Modifier</button><button data-del="${k}">${PD===k?"Confirmer la suppression":"Supprimer"}</button>${isMod(k)?`<button data-rev="${k}">Rétablir l’original</button>`:""}</div></div>`}).join("")+`</div>`).join("")+`</div>`}
function render(){
 const h=location.hash.slice(1)||"dialogue-materiel",p=h.indexOf("-"),id=h.slice(0,p),tab=h.slice(p+1);
 const s=ALLSC.find(x=>x[0]===id)||ALLSC[0],t=TABS.some(x=>x[0]===tab)?tab:"materiel";
 $("side").innerHTML=SC.map(g=>`<h2>/ ${g[0]}</h2>`+g[1].map(x=>`<button data-h="${x[0]}-${t}" aria-pressed="${x[0]===s[0]}">${x[0]===s[0]?"[X]":"[ ]"} ${x[1]}</button>`).join("")).join("");
 const body=t==="materiel"?vMateriel(s):t==="conseils"?vConseils(s):t==="checklist"?vCheck(s):vInv();
 $("main").innerHTML=Q.trim()?vSearch(Q):`<div class="tabs" role="tablist">${TABS.map(x=>`<button role="tab" data-h="${s[0]}-${x[0]}" aria-selected="${x[0]===t}">[ ${x[1]} ]</button>`).join("")}</div>`+body;
 typeIn($("main"))}
document.addEventListener("click",e=>{const T=e.target;
 const b=T.closest("[data-h]");if(b){const same=location.hash.slice(1)===b.dataset.h;if(Q)$("q").value="";Q="";ED=null;PD=null;if(same)render();else location.hash=b.dataset.h;return}
 if(T.closest("[data-add]")){ED={id:null,lv:{}};return render()}
 const ed=T.closest("[data-edit]");if(ed){const id=ed.dataset.edit,lv={};ALLSC.forEach(s=>{const x=s[2].find(y=>y[0]===id);if(x)lv[s[0]]=x});ED={id,lv};return render()}
 const d=T.closest("[data-del]");if(d){const id=d.dataset.del;if(PD!==id){PD=id;return render()}PD=null;
  if(BASE_G[id]){if(!CU.del.includes(id))CU.del.push(id)}else{delete CU.gear[id];delete CU.tips[id];delete CU.use[id]}
  saveCU();applyCustom();return render()}
 const r=T.closest("[data-rev]");if(r){const id=r.dataset.rev;delete CU.gear[id];delete CU.tips[id];delete CU.use[id];CU.del=CU.del.filter(x=>x!==id);saveCU();applyCustom();return render()}
 if(T.closest("[data-resetall]")){if(!RA){RA=true;return render()}RA=false;CU={gear:{},tips:{},use:{},del:[]};saveCU();applyCustom();return render()}
 if(T.closest("[data-cancel]")){ED=null;return render()}
 if(T.closest("[data-save]"))saveForm()});
document.addEventListener("input",e=>{if(e.target.id==="q"){Q=e.target.value;render();return}const m=e.target.dataset.m;if(!m)return;META[m]=e.target.value;try{localStorage.setItem("lab-meta",JSON.stringify(META))}catch(x){}});
document.addEventListener("click",e=>{if(e.target.closest("#pr")){try{window.print()}catch(x){}}const r=e.target.closest("[data-rs]");if(r){Object.keys(ck).forEach(k=>{if(k.indexOf(r.dataset.rs)===0)delete ck[k]});try{localStorage.setItem("lab-ck",JSON.stringify(ck))}catch(x){}render()}});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;ck[k]=e.target.checked;try{localStorage.setItem("lab-ck",JSON.stringify(ck))}catch(x){}});
addEventListener("hashchange",render);render();
</script>
